services:
  jevproxy:
    build: .
    container_name: jevproxy
    ports:
      # Loopback-only by default. Set JEVPROXY_BIND_ADDRESS=0.0.0.0 only when
      # intentional LAN or reverse-proxy exposure is protected separately.
      - "${JEVPROXY_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    environment:
      # MinusPod, so the proxy can name sponsors from the live sponsor list.
      # MINUSPOD_PASSWORD is MinusPod's login password (the proxy logs in for a
      # session cookie), not the TypeSafe key. The TypeSafe key rides in per
      # request as the OpenAI bearer token, so it is not set here.
      - MINUSPOD_BASE_URL=${MINUSPOD_BASE_URL:-}
      - MINUSPOD_PASSWORD=${MINUSPOD_PASSWORD:-}
      - JEV_ALLOW_UNAUTHENTICATED_FALLBACK=${JEV_ALLOW_UNAUTHENTICATED_FALLBACK:-false}
      # Keep the fallback unset in normal deployments. If you set it, callers
      # still need a bearer token unless JEV_ALLOW_UNAUTHENTICATED_FALLBACK=true.
      # - TYPESAFE_API_KEY=${TYPESAFE_API_KEY:-}
    restart: unless-stopped
