[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minuspod_compat"
version = "0.1.0"
description = "Self-contained vendored MinusPod prompt/parse/schema/sponsor/window/pricing helpers."
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[tool.setuptools]
packages = ["minuspod_compat"]
